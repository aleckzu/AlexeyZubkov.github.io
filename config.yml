baseURL: "https://aleckzu.github.io/"
title: "Алексей Зубков"
theme: [hugo-PaperMod]

defaultContentLanguage: ru  # Устанавливаем русский основным
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts"]

languages:
  ru:
    languageName: "Русский"
    weight: 1
    menu:
      main:
        - name: Архив
          url: archives
          weight: 5
        - name: Поиск
          url: search/
          weight: 10
        - name: Теги
          url: tags/
          weight: 15

params:
  env: production
  author: Алексей Зубков
  defaultTheme: auto
  ShowShareButtons: true
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true

  # Твоя главная страница (текст можешь менять здесь)
  homeInfoParams:
    Title: "Привет! 👋"
    Content: >
      Добро пожаловать на мой личный сайт. 
      Здесь я делюсь своими мыслями и проектами.

  # Иконки соцсетей (замени URL на свои или удали лишние)
  socialIcons:
    - name: github
      url: "https://github.com/aleckzu"
    - name: telegram
      url: "https://t.me/твой_логин" # Впиши свой телеграм

  assets:
    disableHLJS: true

markup:
  goldmark:
    renderer:
      unsafe: true # Чтобы работали картинки и видео в постах
