baseURL: "https://aleckzu.github.io/"
title: "Алексей Зубков"
theme: [hugo-PaperMod]

defaultContentLanguage: ru
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts"]

languages:
  ru:
    languageName: "Русский"
    weight: 1
    menu:
      main:
        - name: Архив
          url: archives
          weight: 5
        - name: Поиск
          url: search/
          weight: 10
        - name: Теги
          url: tags/
          weight: 15

params:
  env: production
  author: Алексей Зубков
  defaultTheme: auto
  ShowShareButtons: true
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true

  homeInfoParams:
    Title: "Привет! 👋"
    Content: >
      Добро пожаловать на мой личный сайт. 
      Здесь я делюсь своими мыслями и проектами.

  socialIcons:
    - name: github
      url: "https://github.com/aleckzu"
    - name: telegram
      url: "https://t.me/твой_логин"

  profileMode:
    enabled: true
    title: "Алексей Зубков"
    imageUrl: "images/Gemini_Generated_Image_.png"
    imageTitle: "Логотип AZ"
    imageWidth: 150
    imageHeight: 150
    buttons:
      - name: "Читать статьи"
        url: "posts"

  assets:
    disableHLJS: true

markup:
  goldmark:
    renderer:
      unsafe: true
